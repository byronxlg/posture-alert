name: CI

# Typecheck, unit tests and a production build on every PR and push. The
# video eval (npm run eval) is not run here: it downloads stock footage and
# takes minutes; see runbook/updates.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
